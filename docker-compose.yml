services:
  app:
    build:
      context: .
      args:
        VITE_ADMIN_WECHAT_PHONE: ${VITE_ADMIN_WECHAT_PHONE}
        VITE_WECHAT_PAY_QR_URL: ${VITE_WECHAT_PAY_QR_URL}
    image: class-pet-garden:local
    container_name: class-pet-garden-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3002}:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      # 数据库（SQLite 单文件，容器外挂载到 app_data 卷，路径对应 /data/pet-garden.db）
      SQLITE_PATH: /data/pet-garden.db
      # 安全（生产环境务必修改）
      TOKEN_SECRET: ${TOKEN_SECRET:?请在 .env 中配置 TOKEN_SECRET}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-admin!@#$}
      # 认证限流（同一 IP）
      AUTH_RATE_LIMIT_ENABLED: ${AUTH_RATE_LIMIT_ENABLED:-true}
      AUTH_REGISTER_RATE_LIMIT_MAX: ${AUTH_REGISTER_RATE_LIMIT_MAX:-1}
      AUTH_REGISTER_RATE_LIMIT_WINDOW_MS: ${AUTH_REGISTER_RATE_LIMIT_WINDOW_MS:-3600000}
      AUTH_LOGIN_RATE_LIMIT_MAX: ${AUTH_LOGIN_RATE_LIMIT_MAX:-10}
      AUTH_LOGIN_RATE_LIMIT_WINDOW_MS: ${AUTH_LOGIN_RATE_LIMIT_WINDOW_MS:-60000}
      # 是否生成演示/游览数据（生产设为 1 关闭；关闭后不会再生演示班级）
      DISABLE_DEMO: ${DISABLE_DEMO:-1}
      TZ: Asia/Shanghai
    volumes:
      - app_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/api/health"]
      interval: 30s
      timeout: 5s
      start-period: 40s
      retries: 3

volumes:
  app_data:
